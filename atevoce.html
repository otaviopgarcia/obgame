<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Até Você</title>
  <style>
    :root {
      --bg: #1b1030;
      --fg: #fff;
      --ac: #ff4d8d;
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px)
    }

    html,
    body {
      height: 100%;
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font-family: "Courier New", monospace;
      overflow: hidden;
      -webkit-user-select: none;
      user-select: none
    }

    #wrap {
      position: relative;
      width: min(100vw, calc((100vh - 20px)*16/9));
      aspect-ratio: 16/9;
      margin: 0 auto
    }

    canvas {
      width: 100%;
      height: 100%;
      background: #2a1a4a;
      display: block
    }

    .scr {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.6vw;
      background: rgba(27, 16, 48, .94);
      text-align: center;
      z-index: 6
    }

    .scr.h {
      display: none
    }

    h1 {
      margin: 0;
      font-size: 4vw;
      color: var(--ac)
    }

    p {
      margin: 0;
      font-size: 1.5vw
    }

    .cards {
      display: flex;
      gap: 4vw
    }

    .card {
      border: .4vw solid #5b3f8f;
      padding: 1vw 2vw;
      cursor: pointer;
      background: #2a1a4a
    }

    .card.s {
      border-color: var(--ac)
    }

    .card img {
      height: 16vw;
      display: block;
      margin: auto
    }

    .card b {
      font-size: 1.8vw
    }

    button {
      font: inherit;
      font-size: 2vw;
      padding: .8vw 2.4vw;
      background: var(--ac);
      color: #fff;
      border: 0;
      cursor: pointer
    }

    .pair img {
      height: 26vw
    }

    .pad {
      position: absolute;
      bottom: 2%;
      display: none;
      gap: calc(var(--u)*1.5);
      z-index: 5;
      touch-action: none
    }

    .pad.l {
      left: 3%
    }

    .pad.r {
      right: 3%
    }

    .touch .pad {
      display: flex
    }

    .pad div {
      width: calc(var(--u)*8);
      height: calc(var(--u)*8);
      border-radius: 50%;
      background: rgba(255, 255, 255, .22);
      border: 2px solid rgba(255, 255, 255, .5);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: calc(var(--u)*3.6);
      touch-action: none
    }

    .pad div.on {
      background: rgba(255, 77, 141, .55)
    }
  </style>
</head>

<body>
  <div id="wrap"><canvas id="c" width="800" height="450"></canvas>
    <div class="pad l">
      <div data-k="L">◀</div>
      <div data-k="R">▶</div>
    </div>
    <div class="pad r">
      <div data-k="G">🛡</div>
      <div data-k="J">⤒</div>
      <div data-k="A">👊</div>
    </div>
    <div class="scr" id="sel">
      <h1>ATÉ VOCÊ</h1>
      <p>Escolha quem vai atravessar a trilha</p>
      <div class="cards" id="cards"></div><button id="go">Começar</button>
      <p>A D / ← → andar · W / ↑ / espaço pular · J soco · K / Shift defender</p>
    </div>
    <div class="scr h" id="end">
      <h1>CONSEGUIMOS!</h1>
      <div class="pair"><img id="hold"></div><button id="again">Jogar novamente</button>
    </div>
  </div>

    const rect = (x, y, w, h) => ({ x, y, w, h });
    const hit = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
    const meR = () => rect(me.x - 10, me.y - 58, 20, 58);
    function spark(x, y, c) { fx.push({ x, y, t: 0, c }) }
    function startAtk(n) { me.n = n; me.at = 0; me.buf = 0; me.hit = new Set() }
    function hurtMe(d, from, kb) {
      if (me.inv > 0 || me.hp <= 0 || st != 'play') return;
      const front = (from - me.x) * me.f > 0;
      if (me.guard && front && me.g) { d = Math.floor(d / 2); me.vx = -Math.sign(from - me.x) * kb * .4; me.inv = 14; spark(me.x + me.f * 14, me.y - 30, '#7ad7ff'); if (me.hp - d > 0) { me.hp -= d; return } }
      me.hp -= d; me.vx = -Math.sign(from - me.x || 1) * kb; me.inv = 50; me.atk = 0; me.at = 0; me.n = 0; me.hurt = dur(HURT); spark(me.x, me.y - 30, '#ff4d4d'); stop = 3;
      if (me.hp <= 0) { me.hp = 0; me.dt = 0; me.hurt = 0 }
    }
    function respawn() { me.x = spawnX; me.y = GY; me.vx = me.vy = 0; me.hp = HP0; me.inv = 90; me.dt = 0; me.hurt = 0; me.n = 0; me.at = 0; wave = null; zs = []; me.f = dir; banner = 0 }
    function spawnZ(k, x) { const T = ZT[k]; zs.push({ k, x: clamp(x, 0, W), hp: T.hp, f: x < (wave ? wave.lock + 400 : x + 1) ? 1 : -1, st: 'walk', t: 0, vx: 0, cd: 0, hit: 0, fade: 0, ph: Math.random() * 8 | 0 }) }
    function startWave() { const lock = clamp(me.x - 400, 0, W - 800); wave = { lock, q: WV[waveI].z.slice(), tm: 30, i: 0 }; banner = 110; bannerT = 'ONDA ' + (waveI + 1) + '/' + WV.length }
    function update() {
      t++;
      if (st == 'cut') {
        cut++; const tx = other_x + (mir ? 32 : -32); if (Math.abs(me.x - tx) > 3) { me.vx = Math.sign(tx - me.x) * 2; me.f = Math.sign(me.vx) } else { me.vx = 0; me.f = other_x > me.x ? 1 : -1; arr++ }
        me.x += me.vx; if (arr > 110) { st = 'end'; document.getElementById('end').classList.remove('h') } return
      }
      if (stop > 0) { stop--; return }
      const L = keys.ArrowLeft || keys.KeyA, R = keys.ArrowRight || keys.KeyD, J = keys.ArrowUp || keys.KeyW || keys.Space, G = keys.KeyK || keys.ShiftLeft || keys.ShiftRight;
      if (me.inv > 0) me.inv--;
      if (me.hp <= 0) { me.dt++; me.vx *= .9; if (me.dt > 100) respawn() }
      else if (me.hurt > 0) { me.hurt--; me.vx *= .88 }
      else if (me.n) {
        const A = me.n == 1 ? A1 : A2; me.at++; const i = idx(A, me.at);
        me.vx = (i == (me.n == 1 ? 1 : 1) && me.at < 12) ? me.f * 1.4 : me.vx * .7;
        if (me.at >= dur(A)) { if (me.buf && me.n == 1) startAtk(2); else { me.n = 0 } }
        else if (pressA && me.n == 1) me.buf = 1;
        if (me.n && ((me.n == 1 && (i == 1 || i == 2)) || (me.n == 2 && i == 1))) {
          const rch = rect(me.f > 0 ? me.x + 2 : me.x - 46, me.y - 62, 44, 62);
          for (const z of zs) { if (z.st == 'dead' || me.hit.has(z)) continue; if (hit(rch, rect(z.x - 11, GY - 60, 22, 60))) { me.hit.add(z); dmgZ(z, me.n == 2 ? 1.6 : 1) } }
        }
      }
      else {
        me.guard = G && me.g;
        const sp = me.guard ? 1.1 : 3.4; me.vx = ((R ? 1 : 0) - (L ? 1 : 0)) * sp; if (me.vx && !me.guard) me.f = Math.sign(me.vx);
        if (J && me.g && !me.guard) { me.vy = -11.2; me.g = false }
        if (pressA && !me.guard) { startAtk(1) }
      }
      if (me.hp > 0 && me.n == 0) me.guard = me.guard && !me.hurt;
      pressA = 0;
      me.x += me.vx; me.vy = Math.min(me.vy + .55, 14); me.y += me.vy; if (me.y >= GY) { me.y = GY; me.vy = 0; me.g = true } else me.g = false;
      const lo = wave ? wave.lock + 12 : 10, hi = wave ? wave.lock + 788 : W - 10; me.x = clamp(me.x, lo, hi);
      // waves
      const prog = mir ? W - me.x : me.x;
      if (!wave && waveI < WV.length && prog >= WV[waveI].p && me.hp > 0) startWave();
      if (wave) {
        if (wave.q.length && --wave.tm <= 0) { const front = wave.i % 2 == 0; const x = (front == (dir > 0)) ? wave.lock + 840 : wave.lock - 40; spawnZ(wave.q.shift(), x); wave.i++; wave.tm = 70 }
        if (!wave.q.length && zs.every(z => z.st == 'dead')) { wave = null; waveI++; spawnX = me.x; goT = 300; banner = 90; bannerT = waveI < WV.length ? 'ONDA LIMPA!' : 'CAMINHO LIVRE!' }
      }
      // zombies
      for (const z of zs) {
        const T = ZT[z.k]; z.t++; z.x += z.vx; z.vx *= .85; z.x = clamp(z.x, 0, W);
        if (z.st == 'dead') { if (z.t > FALL[0][1] * 5 + 60) z.fade++; continue }
        if (z.st == 'hurt') { if (z.t >= dur(HURT)) { z.st = 'walk'; z.t = 0; z.cd = 6 } continue }
        const dx = me.x - z.x;
        if (z.st == 'walk') {
          if (Math.abs(dx) > 34 || me.hp <= 0) z.x += Math.sign(dx) * T.sp * (me.hp > 0 ? 1 : 0); z.cd--;
          if (Math.abs(dx) < 46 && z.cd <= 0 && me.hp > 0 && Math.abs(me.y - GY) < 30) { z.st = 'atk'; z.t = 0; z.hit = 0 }
        }
        else if (z.st == 'atk') {
          const L2 = ZA(T.s), i = idx(L2, z.t);
          if (z.t >= dur(L2)) { z.st = 'walk'; z.t = 0; z.cd = 25 }
          else if ((i == 1 || i == 2) && !z.hit && hit(rect(z.f > 0 ? z.x : z.x - 48, GY - 58, 48, 58), meR())) { z.hit = 1; hurtMe(T.dmg, z.x, T.kb) }
        }
      }
      for (let i = 0; i < zs.length; i++)for (let j = i + 1; j < zs.length; j++) { const a = zs[i], b = zs[j]; if (a.st == 'dead' || b.st == 'dead') continue; const d = b.x - a.x; if (Math.abs(d) < 18) { const p = (18 - Math.abs(d)) * .15 * (d >= 0 ? 1 : -1); a.x -= p; b.x += p } }
      zs = zs.filter(z => z.fade < 40);
      for (const f of fx) f.t++; fx = fx.filter(f => f.t < 12);
      if (banner > 0) banner--; if (goT > 0) goT--;
      if (!wave && waveI >= WV.length && me.hp > 0 && Math.abs(me.x - other_x) < 45) { st = 'cut'; cut = 0; me.vx = 0 }
    }
    function dmgZ(z, kbm) {
      const T = ZT[z.k]; z.hp -= 1; z.t = 0; z.vx = me.f * T.kb * kbm * (z.hp <= 0 ? 1.3 : 1); stop = 4; spark(z.x, GY - 30, '#fff');
      if (z.hp <= 0) z.st = 'dead'; else z.st = 'hurt'
    }
    // draw
    function spr(f, x, y, flip, al) { if (!f || !f.im.complete) return; ctx.save(); ctx.translate(Math.round(x), Math.round(y)); if (!!flip !== f.fl) ctx.scale(-1, 1); ctx.globalAlpha = al ?? 1; const s = DS * f.sc; ctx.drawImage(f.im, -f.ax * s, -f.ay * s, f.w * s, f.h * s); ctx.restore() }
    function bg() {
      if (BG.complete && BG.naturalWidth) {
        const h = 450;
        const w = BG.naturalWidth * h / BG.naturalHeight;
        const offset = -((camx * .55) % w);
        ctx.drawImage(BG, offset - w, 0, w, h);
        ctx.drawImage(BG, offset, 0, w, h);
        ctx.drawImage(BG, offset + w, 0, w, h);
      }
      else {
        const g = ctx.createLinearGradient(0, 0, 0, 450);
        g.addColorStop(0, '#3a1f6b');
        g.addColorStop(1, '#ff7aa8');
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, 800, 450);
      }
    }
    function meFrame() {
      const c = CH[sel];
      if (me.hp <= 0) return F[c + '_luta'][2][fi(FALL, me.dt)];
      if (me.hurt > 0) return F[c + '_luta'][1][fi(HURT, dur(HURT) - me.hurt)];
      if (me.n) return F[c + '_luta'][0][fi(me.n == 1 ? A1 : A2, me.at)];
      if (me.guard) return F[c + '_luta'][0][7];
      if (!me.g) return F[c + '_acao'][1][3];
      if (Math.abs(me.vx) > .1) return F[c + '_acao'][0][Math.floor(t / 4) % 8];
      return F[c + '_pad'][2][0]
    }
    function zFrame(z) {
      const T = ZT[z.k], k = T.k;
      if (z.st == 'dead') return F[k + '_luta'][2][fi(FALL, z.t)];
      if (z.st == 'hurt') return F[k + '_luta'][1][fi(HURT, z.t)];
      if (z.st == 'atk') return F[k + '_luta'][0][fi(ZA(T.s), z.t)];
      return F[k + '_pad'][2][(Math.floor(t / (z.k == 2 ? 3 : 4)) + z.ph) % 8]
    }
    function txt(s, x, y, sz, c, al) { ctx.font = 'bold ' + sz + 'px "Courier New"'; ctx.textAlign = al || 'left'; ctx.lineWidth = 4; ctx.strokeStyle = '#000'; ctx.strokeText(s, x, y); ctx.fillStyle = c; ctx.fillText(s, x, y) }
    function draw() {
      camx += ((wave ? wave.lock : clamp(me.x - 400, 0, W - 800)) - camx) * .12; const cx = Math.round(camx);
      ctx.clearRect(0, 0, 800, 450); bg(); ctx.save(); ctx.translate(-cx, 0);
      const hugging = st != 'play' && arr > 0;
      if (hugging && HUG.complete) { const sc = 88 / HUG.naturalHeight, w = HUG.naturalWidth * sc; ctx.drawImage(HUG, (me.x + other_x) / 2 - w / 2, GY - HUG.naturalHeight * sc, w, HUG.naturalHeight * sc) }
      else { spr(F[CH[other] + '_pad'][2][0], other_x, GY, !mir) }
      for (const z of zs.slice().sort((a, b) => a.x - b.x)) {
        spr(zFrame(z), z.x, GY, z.f < 0, z.st == 'dead' && z.fade ? 1 - z.fade / 40 : 1);
        if (z.st != 'dead' && z.hp < ZT[z.k].hp) { ctx.fillStyle = '#000'; ctx.fillRect(z.x - 12, GY - 70, 24, 4); ctx.fillStyle = '#e33'; ctx.fillRect(z.x - 11, GY - 69, 22 * z.hp / ZT[z.k].hp, 2) }
      }
      if (!hugging) { const bl = me.inv > 0 && me.hp > 0 && Math.floor(t / 3) % 2; spr(meFrame(), me.x, me.y, me.f < 0, bl ? .4 : 1) }
      if (hugging && arr > 25) { ctx.font = '28px serif'; ctx.textAlign = 'left'; ctx.fillStyle = '#ff4d8d'; ctx.fillText('♥', (me.x + other_x) / 2 - 8, 330 - Math.min(arr - 25, 40)) }
      for (const f of fx) { ctx.strokeStyle = f.c; ctx.lineWidth = 2; const r = 4 + f.t * 1.6; ctx.beginPath(); for (let i = 0; i < 6; i++) { const a = i * 1.047 + f.t * .1; ctx.moveTo(f.x + Math.cos(a) * r * .5, f.y + Math.sin(a) * r * .5); ctx.lineTo(f.x + Math.cos(a) * r, f.y + Math.sin(a) * r) } ctx.stroke() }
      ctx.restore();
      // HUD
      ctx.fillStyle = 'rgba(0,0,0,.6)'; ctx.fillRect(10, 10, 164, 18); ctx.fillStyle = me.hp <= 6 ? '#ff4d4d' : '#ff4d8d'; ctx.fillRect(12, 12, 160 * me.hp / HP0, 14);
      txt('♥ ' + NAMES[other] + ' está a ' + Math.max(0, Math.round(Math.abs(other_x - me.x) / 10)) + ' m', 12, 46, 14, '#fff');
      if (banner > 0) txt(bannerT, 400, 150, 34, '#fff', 'center');
      if (goT > 0 && !wave && Math.floor(t / 20) % 2) txt('VAI ' + (mir ? '◀' : '▶') + '▶'.slice(0, 0), mir ? 90 : 710, 200, 30, '#ffd34d', 'center');
      if (t < 360 && st == 'play') txt('J: soco (2x = combo) · K/Shift: defender · espaço/W: pular', 400, 432, 13, '#fff', 'center');
      if (me.hp <= 0) txt('CAIU... voltando ao checkpoint', 400, 230, 22, '#fff', 'center')
    }
    let last = 0, acc = 0; function loop(ts) { const d = Math.min(100, ts - last); last = ts; acc += d; while (acc >= 16.667) { if (st == 'play' || st == 'cut') update(); acc -= 16.667 } if (st != 'sel') draw(); requestAnimationFrame(loop) } requestAnimationFrame(loop);
  </script>
